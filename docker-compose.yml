version: '3.8'

services:
  # ── Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: velore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-velore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velore_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-velore_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velore}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: velore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Prisma Studio (dev only) ───────────────────────────────────
  prisma-studio:
    image: node:20-alpine
    container_name: velore_prisma_studio
    working_dir: /app
    volumes:
      - ./packages/db:/app
      - ./node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-velore}:${POSTGRES_PASSWORD:-velore_secret}@postgres:5432/${POSTGRES_DB:-velore_db}
    ports:
      - "5555:5555"
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - studio   # only starts with: docker-compose --profile studio up

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: velore_network